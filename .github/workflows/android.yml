name: Build ReUse Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Extract project
        run: |
          unzip -q ReUseRefresh-2starter.zip -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
      - name: Build APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ReUse-Refresh-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
